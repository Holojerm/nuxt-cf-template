version: 2
updates:
  # bun — npm_and_yarn cannot update bun.lock.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    # Group safe updates so we get one PR per week instead of 30.
    # Major bumps stay separate so they get reviewed individually.
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
